name: Build & Tag
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build without publishing a tag
        default: true
        type: boolean
permissions:
  contents: write
jobs:
  release:
    uses: ccmjs/component-release/.github/workflows/release.yml@v2.0.0
    with:
      tooling-ref: v2.0.0
      main: ccm-ui.mjs
      dry-run: ${{ inputs.dry-run }}
